          git commit -q -m UCG-patch-flags
          git push
      - name: Start the APK build
        env:
          GH_TOKEN: ${{ secrets['UCG_TOKEN'] || secrets['GITHUB_TOKEN'] }}
        run: |
          W=android
          for i in $(seq 1 18); do
            gh workflow run $W.yml --ref $GITHUB_REF_NAME -f abi=arm64-v8a && exit 0
            sleep 10
          done
          exit 1
